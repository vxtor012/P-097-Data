[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-prerag-pipeline"
version = "1.0.0"
description = "Hệ thống Pre-RAG Data Pipeline tiếng Việt chuyên biệt cho tư vấn mua bán ô tô điện"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "pymupdf>=1.23.0",
    "trafilatura>=1.6.0",
    "httpx>=0.25.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/pipeline/tests"]
pythonpath = ["src"]
